<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#ffffff"/>
  
  <g id="floorPlan">
    <rect x="50" y="50" width="700" height="500" fill="url(#floorGradient)" stroke="#333" stroke-width="4"/>
    
    <line x1="300" y1="50" x2="300" y2="350" stroke="#333" stroke-width="3"/>
    <line x1="50" y1="350" x2="750" y2="350" stroke="#333" stroke-width="3"/>
    <line x1="500" y1="350" x2="500" y2="550" stroke="#333" stroke-width="3"/>
    
    <rect x="280" y="200" width="40" height="80" fill="url(#wallGradient)" stroke="#666" stroke-width="2" rx="5"/>
    <line x1="290" y1="210" x2="310" y2="270" stroke="#999" stroke-width="2"/>
    
    <text x="175" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Living Room</text>
    
    <text x="525" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Kitchen</text>
    
    <text x="175" y="450" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Bedroom 1</text>
    
    <text x="625" y="450" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Bedroom 2</text>
    
    <rect x="100" y="100" width="120" height="60" fill="#8B7355" stroke="#654321" stroke-width="2" rx="5"/>
    <text x="160" y="135" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">Sofa</text>
    
    <rect x="400" y="100" width="80" height="80" fill="#D4A574" stroke="#A0826D" stroke-width="2" rx="5"/>
    <circle cx="440" cy="140" r="25" fill="#E6D5B8" stroke="#C19A6B" stroke-width="2"/>
    <text x="440" y="145" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Table</text>
    
    <rect x="100" y="400" width="100" height="120" fill="#A0826D" stroke="#654321" stroke-width="2" rx="5"/>
    <rect x="110" y="410" width="80" height="100" fill="#C19A6B" stroke="#8B7355" stroke-width="1"/>
    <text x="150" y="465" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Bed</text>
    
    <rect x="550" y="400" width="100" height="120" fill="#A0826D" stroke="#654321" stroke-width="2" rx="5"/>
    <rect x="560" y="410" width="80" height="100" fill="#C19A6B" stroke="#8B7355" stroke-width="1"/>
    <text x="600" y="465" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Bed</text>
    
    <circle cx="650" cy="150" r="8" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <line x1="650" y1="142" x2="650" y2="120" stroke="#FFA500" stroke-width="2"/>
    <circle cx="650" cy="115" r="5" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  </g>
  
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">Apartment Designer</text>
</svg>
